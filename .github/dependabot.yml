version: 2
updates:
  # `better-auth`, `better-call`, `@better-fetch/fetch` and `zod` are pinned through `overrides` for
  # security fixes: update them together with `@neondatabase/auth` and validate login end to end.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
