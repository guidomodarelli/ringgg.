name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, tipos, tests y build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      # `bun lint` (golfo-lint) and `bun check` (typecheck) are only in Bun canary until 1.4.5.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: canary
      # golfo-lint runs actionlint and zizmor with uvx, at pinned versions.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: npm ci
      - run: npm run lint
      - run: npx golfo-lint workflows
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: E2E con Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Full Chromium as well as the headless shell: the service worker spec needs notification permissions.
      - run: npx playwright install --with-deps chromium
      # The live specs sign in against the dedicated Neon branch `ci`; without these secrets (forks) they are skipped.
      - run: npm run test:e2e
        env:
          E2E_NEON_AUTH_EMAIL: ${{ secrets.E2E_NEON_AUTH_EMAIL }}
          E2E_NEON_AUTH_PASSWORD: ${{ secrets.E2E_NEON_AUTH_PASSWORD }}
          E2E_NEON_AUTH_BASE_URL: ${{ secrets.E2E_NEON_AUTH_BASE_URL }}
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
